name: build-jekyll.yml
on:
  push:
    branches:
      - gh-pages
      - 2025-redesign # TODO: Remove before merge
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .asdf/**
            vendor/bundle
          key: ${{runner.os}}-cache=${{hashFiles('**/cache.key')}}
          restore-keys: |
            ${{ runner.os }}-cache-
        # Stuck with master until a new release https://github.com/jeffreytse/jekyll-deploy-action/issues/98#issuecomment-2982363972
      - uses: jeffreytse/jekyll-deploy-action@master
        with:
          provider: 'test' # TODO: Change to github before merge
          token: ${{ secrets.GITHUB_TOKEN }}
          pre_build_commands: pacman -S --noconfirm nodejs
