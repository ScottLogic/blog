name: build-jekyll.yml
on:
  push:
    branches:
      - gh-pages
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .asdf/**
            vendor/bundle
          key: ${{runner.os}}-cache=${{hashFiles('**/cache.key')}}
          restore-keys: |
            ${{ runner.os }}-cache-
      - uses: jeffreytse/jekyll-deploy-action@v0.6.0
        with:
          provider: 'github'
