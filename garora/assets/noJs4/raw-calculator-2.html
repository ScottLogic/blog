<html lang="en">

<meta charset="utf-8">

<title>Pure CSS Calculator</title>
<style>

*{box-sizing:border-box;}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;
     display:flex;justify-content:center;padding:28px;margin:0;}
.wrap{background:#1e293b;border-radius:18px;padding:22px 26px 26px;
      box-shadow:0 18px 50px rgba(0,0,0,.55);}
h1{font-size:18px;margin:0 0 6px;}
.note{font-size:12px;line-height:1.5;color:#94a3b8;margin:0 0 18px;max-width:520px;}
form{margin:0;}
input[type=radio]{position:absolute;opacity:0;width:0;height:0;margin:0;pointer-events:none;}
.engine{counter-reset:r 0;display:grid;grid-template-columns:repeat(3,60px) 60px;
        gap:8px;align-items:stretch;justify-items:stretch;}
.acc{position:absolute;visibility:hidden;width:0;height:0;overflow:hidden;}
.dg{display:flex;align-items:center;justify-content:center;height:52px;
         border:1px solid #334155;border-radius:10px;cursor:pointer;font-size:20px;
         background:#0b1220;color:#cbd5e1;user-select:none;transition:.08s;}
.dg:hover{border-color:#64748b;color:#fff;background:#111c30;}
.dg:active{transform:translateY(1px);}
/* only A's first keypad shows initially */
.kA0{display:flex;}
.kA1,.kA2,.kB0,.kB1,.kB2{display:none;}
/* operator + equals keys hidden until their operand has >=1 digit */
.op,.eqk{display:none;align-items:center;justify-content:center;height:52px;
         border-radius:10px;cursor:pointer;font-size:22px;user-select:none;}
.op{border:1px solid #b45309;background:#f59e0b;color:#0f172a;font-weight:800;}
.op:hover{filter:brightness(1.08);}
.eqk{border:1px solid #1d4ed8;background:#2563eb;color:#fff;font-weight:800;}
.eqk:hover{filter:brightness(1.1);}
.clr{height:52px;border:1px solid #7f1d1d;border-radius:10px;background:#b91c1c;color:#fff;
     font-weight:800;cursor:pointer;font-size:18px;}
.clr:hover{background:#dc2626;}
#screen{background:#020617;border:1px solid #334155;border-radius:12px;
        padding:14px 16px;min-height:58px;display:flex;align-items:center;gap:8px;
        font-variant-numeric:tabular-nums;margin-bottom:8px;}
.num{font-size:24px;letter-spacing:2px;color:#e2e8f0;min-width:14px;}
.d::after{content:"";}
#numA:empty::after{content:"0";}
#scrOp::after{font-size:22px;color:#f59e0b;}
.eq{font-size:22px;color:#64748b;}
#scrR{font-size:26px;font-weight:800;color:#38bdf8;margin-left:auto;visibility:hidden;}
#scrR::after{content:counter(r);}
