<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jump Runner</title>
<style>
  :root {
    --ground: 80px;
    --char-size: 48px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    gap: 16px;
    user-select: none;
  }

  h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  p  { font-size: 13px; color: #94a3b8; }

  .game {
    position: relative;
    width: 640px;
    max-width: 92vw;
    height: 260px;
    overflow: hidden;
    border-radius: 14px;
    background: linear-gradient(180deg, #1e293b 0%, #334155 70%, #475569 100%);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.05);
    outline: none;
    cursor: pointer;
  }
  .game:focus-visible { box-shadow: 0 0 0 3px #38bdf8, 0 12px 40px rgba(0,0,0,0.45); }

  .ground {
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: var(--ground);
    background: repeating-linear-gradient(90deg, #64748b 0 40px, #52607a 40px 80px);
    background-size: 80px 100%;
    animation: scroll-ground 1.8s linear infinite;
  }
  @keyframes scroll-ground {
    from { background-position: 0 0; }
    to   { background-position: -80px 0; }
  }
  .paused .ground,
  .paused .cloud { animation-play-state: paused; }

  .character {
    position: absolute;
    left: 70px;
    bottom: var(--ground);
    width: var(--char-size);
    height: var(--char-size);
    border-radius: 10px 10px 6px 6px;
    background: radial-gradient(circle at 32% 30%, #fcd34d, #f59e0b);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    z-index: 3;
    will-change: transform;
  }
  .character::before,
  .character::after {
    content: "";
    position: absolute;
    top: 14px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1e293b;
  }
  .character::before { left: 10px; }
  .character::after  { right: 10px; }

  .wall {
    position: absolute;
    bottom: var(--ground);
    width: 34px;
    border-radius: 4px;
    background: linear-gradient(180deg, #ef4444, #b91c1c);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
    z-index: 2;
    will-change: left;
  }

  .cloud {
    position: absolute;
    top: 30px;
    width: 70px; height: 22px;
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    animation: drift 7.2s linear infinite;
  }
  .cloud.c2 { top: 60px; width: 50px; animation-delay: -3.6s; }
  @keyframes drift {
    from { left: 100%; }
    to   { left: -80px; }
  }

  .hud {
    position: absolute;
    top: 12px; right: 16px;
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;
    z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.78);
    z-index: 5;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 28px; color: #f87171; }
  .overlay .score { font-size: 15px; color: #e2e8f0; }
  .overlay button {
    margin-top: 8px;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #0f172a;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .overlay button:hover { background: #7dd3fc; }
</style>
</head>
<body>
  <h1>Jump Runner</h1>
  <p>Click the arena (or press SPACE / ↑) to jump. Clear the walls — one hit ends the game.</p>

  <div class="game" id="game" tabindex="0">
    <div class="cloud"></div>
    <div class="cloud c2"></div>

    <div class="hud" id="hud">Score: 0</div>

    <div class="character" id="character"></div>
    <div class="ground"></div>

    <div class="overlay" id="overlay">
      <h2>Game Over</h2>
      <div class="score" id="finalScore">Score: 0</div>
      <button id="restart">Play Again</button>
    </div>
  </div>

<script>
(function () {
  const game      = document.getElementById("game");
  const character = document.getElementById("character");
  const hud       = document.getElementById("hud");
  const overlay   = document.getElementById("overlay");
  const finalScore= document.getElementById("finalScore");
  const restartBtn= document.getElementById("restart");

  const GROUND = 80;          // px, matches --ground
  const CHAR_SIZE = 48;
  const CHAR_LEFT = 70;
  const GRAVITY = 2400;       // px/s^2
  const JUMP_VELOCITY = 820;  // px/s

  let running = false;
  let jumping = false;
  let charY = 0;              // height above ground (px)
  let velY = 0;
  let score = 0;
  let lastTime = 0;
  let spawnTimer = 0;
  let spawnInterval = 1.4;    // seconds
  let speed = 320;            // px/s that walls move left
  let walls = [];            // { el, x, w, h, passed }
  let rafId = null;

  function reset() {
    walls.forEach(w => w.el.remove());
    walls = [];
    charY = 0;
    velY = 0;
    jumping = false;
    score = 0;
    spawnTimer = 0.6;
    spawnInterval = 1.4;
    speed = 320;
    hud.textContent = "Score: 0";
    character.style.transform = "translateY(0)";
    overlay.classList.remove("show");
    game.classList.remove("paused");
  }

  function start() {
    reset();
    running = true;
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function jump() {
    if (!running) return;
    if (!jumping) {
      jumping = true;
      velY = JUMP_VELOCITY;
    }
  }

  function spawnWall() {
    const el = document.createElement("div");
    el.className = "wall";
    const h = 40 + Math.floor(Math.random() * 45); // 40-85px tall
    el.style.height = h + "px";
    el.style.left = game.clientWidth + "px";
    game.appendChild(el);
    walls.push({ el, x: game.clientWidth, w: 34, h, passed: false });
  }

  function gameOver() {
    running = false;
    game.classList.add("paused");
    finalScore.textContent = "Score: " + score;
    overlay.classList.add("show");
    cancelAnimationFrame(rafId);
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // Character physics
    if (jumping) {
      charY += velY * dt;
      velY -= GRAVITY * dt;
      if (charY <= 0) {
        charY = 0;
        velY = 0;
        jumping = false;
      }
    }
    character.style.transform = "translateY(" + (-charY) + "px)";

    // Spawn walls
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnWall();
      // randomize next spawn a bit so it stays fair but varied
      spawnTimer = spawnInterval + Math.random() * 0.6;
    }

    // Move walls + collision + scoring
    const charLeft = CHAR_LEFT;
    const charRight = CHAR_LEFT + CHAR_SIZE;
    const charBottom = charY;              // above ground
    const charTop = charY + CHAR_SIZE;

    for (let i = walls.length - 1; i >= 0; i--) {
      const wall = walls[i];
      wall.x -= speed * dt;
      wall.el.style.left = wall.x + "px";

      const wLeft = wall.x;
      const wRight = wall.x + wall.w;
      const wTop = wall.h;                  // wall spans 0..h above ground

      // Collision (AABB): horizontal overlap AND character low enough
      const horizontalOverlap = charRight > wLeft && charLeft < wRight;
      const verticalOverlap = charBottom < wTop; // char's feet below wall top
      if (horizontalOverlap && verticalOverlap) {
        gameOver();
        return;
      }

      // Scoring: wall fully passed the character
      if (!wall.passed && wRight < charLeft) {
        wall.passed = true;
        score++;
        hud.textContent = "Score: " + score;
        // gentle difficulty ramp
        speed = Math.min(speed + 8, 620);
        spawnInterval = Math.max(spawnInterval - 0.02, 0.85);
      }

      // Cleanup off-screen walls
      if (wRight < -10) {
        wall.el.remove();
        walls.splice(i, 1);
      }
    }

    rafId = requestAnimationFrame(loop);
  }

  // Input: a single click / tap / key press = one full jump
  game.addEventListener("mousedown", (e) => {
    game.focus();
    jump();
  });
  game.addEventListener("touchstart", (e) => {
    e.preventDefault();
    jump();
  }, { passive: false });

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!running && overlay.classList.contains("show")) {
        start();
      } else {
        jump();
      }
    }
  });

  restartBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    start();
  });

  // Kick things off
  start();
})();
</script>
</body>
</html>
