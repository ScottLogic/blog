<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pure CSS Calculator</title>
<style>

*{box-sizing:border-box;}
body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;
     display:flex;justify-content:center;padding:28px;margin:0;}
.wrap{background:#1e293b;border-radius:18px;padding:22px 26px 26px;
      box-shadow:0 18px 50px rgba(0,0,0,.55);}
h1{font-size:18px;margin:0 0 6px;}
.note{font-size:12px;line-height:1.5;color:#94a3b8;margin:0 0 18px;max-width:560px;}
form{margin:0;}
/* hide radios but keep them counting (NOT display:none, which would skip counters) */
input[type=radio]{position:absolute;opacity:0;width:0;height:0;margin:0;pointer-events:none;}
.engine{counter-reset:r 0 ca 0 cb 0;display:grid;
        grid-template-columns:repeat(7,48px);gap:6px;align-items:center;justify-items:stretch;}
/* accumulator spans: present in flow-tree for counters, but visually removed */
.acc,.pp{position:absolute;visibility:hidden;width:0;height:0;overflow:hidden;}
.colhead{font-size:10px;color:#94a3b8;text-align:center;}
.tag{font-size:13px;font-weight:700;color:#38bdf8;text-align:center;}
label.dg{display:flex;align-items:center;justify-content:center;height:26px;
         border:1px solid #334155;border-radius:6px;cursor:pointer;font-size:13px;
         background:#0b1220;color:#cbd5e1;user-select:none;transition:.08s;}
label.dg:hover{border-color:#64748b;color:#fff;}
/* highlight the selected digit (input is immediately followed by its label) */
input.dg-x{}
input[type=radio]:checked + label.dg{background:#2563eb;border-color:#3b82f6;color:#fff;font-weight:700;}
label.op{display:flex;align-items:center;justify-content:center;height:26px;
         border:1px solid #475569;border-radius:6px;cursor:pointer;font-size:16px;
         background:#1f2937;color:#cbd5e1;user-select:none;}
label.op:hover{border-color:#94a3b8;color:#fff;}
input[type=radio]:checked + label.op{background:#f59e0b;border-color:#f59e0b;color:#0f172a;font-weight:700;}
.clr{height:26px;border:1px solid #7f1d1d;border-radius:6px;background:#b91c1c;color:#fff;
     font-weight:700;cursor:pointer;font-size:13px;}
.clr:hover{background:#dc2626;}
#screen{background:#020617;border:1px solid #334155;border-radius:10px;
        padding:12px 14px;min-height:48px;display:flex;align-items:center;gap:8px;
        flex-wrap:wrap;font-variant-numeric:tabular-nums;margin-bottom:6px;}
#scrA::after{content:counter(ca);}
#scrB::after{content:counter(cb);}
#scrR::after{content:counter(r);}
#scrA,#scrB{font-size:20px;color:#e2e8f0;}
#scrOp::after{font-size:20px;color:#f59e0b;}
.eq{font-size:20px;color:#64748b;}
#scrR{font-size:24px;font-weight:800;color:#38bdf8;margin-left:auto;}
